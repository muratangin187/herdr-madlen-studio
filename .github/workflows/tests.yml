name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests
      - run: python3 -m unittest discover -s theme/mods/madlen-chat -p 'test_*.py'
      - run: python3 -m unittest discover -s extras/outputs -p test_install.py
      - run: python3 -m unittest discover -s extras/outputs/mod -p test_history.py
      - run: node test-chat-state.cjs
      - run: node test-previews.mjs
